<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delivery board</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Route delivery board</h1>
      <p id="status" role="status">Pick a route</p>
      <div class="routes">
        <button type="button" data-route="north">North route</button>
        <button type="button" data-route="south">South route</button>
      </div>
      <ul id="deliveries"></ul>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
